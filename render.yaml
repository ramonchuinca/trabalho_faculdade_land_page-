# Blueprint do Render (New > Blueprint, apontando para este repositório).
# As variáveis marcadas com sync:false são preenchidas no painel — nunca versionar segredos.
services:
  - type: web
    name: vitalis-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # URL do Netlify, ex.: https://vitalis-clinica.netlify.app (sem barra final)
